name: CI

# Quality gate for every branch, every PR, and `main`: typecheck, tests, build.
# `main` used to be excluded here because deploy.yml ran the same gate on it.
# deploy.yml is gone (D-49 — it never once deployed), so excluding `main` would
# have left it with no gate at all. Production deploys to Vercel are driven from
# a dev box via `scripts/ship.sh` — see docs/PIPELINE.md.

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      # The .mjs scripts sit outside every other gate — tsc ignores them, eslint
      # doesn't cover them, and the build never imports them. A syntax error in
      # one shipped to main once and only surfaced when the screenshots workflow
      # ran. This is the cheapest gate that would have caught it.
      - name: Syntax-check scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Lint (soft — repo carries pre-existing debt)
        run: npx eslint . || echo "::warning::eslint reported issues (pre-existing debt tolerated)"
      # Rules that typecheck, tests and the build are all happy to violate: a
      # solid accent button, a px icon size, a retired variant, a glyph name
      # rendering as a label. Each one is a regression that actually happened
      # during the icon/button pass and was caught by eye — one of them by the
      # user, in a shipped view.
      - name: Design system
        run: node scripts/check-design-system.mjs
      # Static, so it grades the palette rather than the screenshot. The a11y
      # job below can only fail on what the demo journal happens to render, and
      # a token used by one branch of one ternary the seed never takes had been
      # illegible in two themes for the gate's entire existence.
      - name: Palette contrast
        run: node scripts/check-contrast.mjs
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  # Accessibility gate (BUJO-94 tail). Runs against a production preview and
  # fails on serious/critical axe violations only — the moderate ones are mostly
  # colour-contrast findings on chart internals, which need the data-viz palette
  # decision rather than a blanket fix.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Playwright stays out of the app tree deliberately (see scripts/*.mjs):
      # installed here with --no-save so it never reaches a user's bundle.
      - name: Install Playwright
        run: |
          npm i -D --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Serve preview
        run: npx vite preview --port 4173 &
      - name: Wait for preview
        run: npx wait-on http://localhost:4173 --timeout 60000
      - name: axe-core
        run: BUJO_URL=http://localhost:4173 node scripts/a11y-axe.mjs
      # Smoke has never run in CI — it was local-only, which is how it managed
      # to sit on a wrong default port (5173, Vite's dev default, i.e. whichever
      # project on the machine booted first) and report a clean 25/25 against a
      # different application. It asserts its own identity now, so it can be
      # trusted here. Same preview server, no extra build.
      - name: Smoke every view
        run: BUJO_URL=http://localhost:4173 node scripts/smoke-views.mjs
